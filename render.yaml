services:
  - type: web
    runtime: static
    name: vitrine-setorial-brasil
    buildCommand: echo "Vitrine Setorial Brasil - site estatico pronto"
    staticPublishPath: ./site
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    headers:
      - path: /sitemap.xml
        name: Content-Type
        value: "application/xml; charset=utf-8"
      - path: /sitemap.xml
        name: Cache-Control
        value: "public, max-age=300, must-revalidate"
      - path: /robots.txt
        name: Content-Type
        value: "text/plain; charset=utf-8"
      - path: /robots.txt
        name: Cache-Control
        value: "public, max-age=300, must-revalidate"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=604800"
